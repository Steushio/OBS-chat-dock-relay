<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Alert Dock</title>
  <style>
    :root {
      --bg-dark: #18181b;
      --bg-card: #1e1e1e;
      --border: #2e2e33;
      --text-main: #e4e4e7;
      --text-muted: #a1a1aa;
      --color-superchat: #ef4444;
      --color-member: #eab308;
      --color-gift: #a855f7;
      --color-sub: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Connection status bar */
    #status-bar {
      background-color: #0f0f11;
      padding: 4px 8px;
      font-size: 11px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .badge-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }
    .badge-indicator.connected { background-color: #22c55e; }
    .badge-indicator.disconnected { background-color: #ef4444; }

    /* Alert List */
    #alerts-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Alert Card Design */
    .alert-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--color-superchat);
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .alert-card.superchat { border-left-color: var(--color-superchat); }
    .alert-card.sticker { border-left-color: #f97316; }
    .alert-card.membership { border-left-color: var(--color-member); }
    .alert-card.gift { border-left-color: var(--color-gift); }
    .alert-card.subscription { border-left-color: var(--color-sub); }

    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .alert-title {
      font-size: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .alert-badge {
      font-size: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 1px 5px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .badge-icon {
      font-size: 9px;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .alert-amount {
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .superchat .alert-amount { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .sticker .alert-amount { background-color: rgba(249, 115, 22, 0.2); color: #fed7aa; }
    .membership .alert-amount { background-color: rgba(234, 179, 8, 0.2); color: #fef08a; }
    .gift .alert-amount { background-color: rgba(168, 85, 247, 0.2); color: #e9d5ff; }
    .subscription .alert-amount { background-color: rgba(34, 197, 94, 0.2); color: #bbf7d0; }

    .alert-message {
      font-size: 12px;
      word-break: break-word;
      color: var(--text-main);
    }

    .alert-time {
      font-size: 10px;
      color: var(--text-muted);
      align-self: flex-end;
    }

    .sticker-img {
      max-height: 50px;
      max-width: 50px;
      object-fit: contain;
      margin-top: 2px;
    }

    /* Empty state */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 6px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <div>
      <span id="status-dot" class="badge-indicator disconnected"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <div>Alert Stream</div>
  </div>

  <div id="alerts-container">
    <div id="empty-state">
      <div style="font-size: 20px;">🛎️</div>
      <div>No alerts captured yet</div>
      <div style="font-size: 11px; max-width: 180px;">Super Chats and Membership events will appear here in real-time.</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('alerts-container');
    const emptyState = document.getElementById('empty-state');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    let ws = null;
    let maxAlerts = 50;
    let audioSettings = {};

    function playAlertSound() {
      if (!audioSettings.alertSoundEnabled) return;
      const volume = (audioSettings.alertSoundVolume !== undefined ? audioSettings.alertSoundVolume : 100) / 100;
      if (audioSettings.alertSoundType === 'default') {
        playSyntheticTone(volume);
      } else if (audioSettings.alertSoundFile) {
        const audio = new Audio(`/audio?path=${encodeURIComponent(audioSettings.alertSoundFile)}`);
        audio.volume = volume;
        audio.play().catch(e => console.error(e));
      }
    }

    function playSyntheticTone(volume) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain1.gain.setValueAtTime(volume, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.2);
        
        setTimeout(() => {
          try {
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880, ctx.currentTime);
            gain2.gain.setValueAtTime(volume, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc2.start();
            osc2.stop(ctx.currentTime + 0.4);
          } catch (e) {}
        }, 120);
      } catch (err) {
        console.error(err);
      }
    }

    async function connect() {
      try {
        statusText.innerText = 'Connecting...';
        const response = await fetch('/status');
        const config = await response.json();
        
        ws = new WebSocket(`ws://127.0.0.1:${config.wsPort || 3001}`);

        ws.onopen = () => {
          statusDot.className = 'badge-indicator connected';
          statusText.innerText = 'Connected';
        };

        ws.onmessage = (event) => {
          const payload = JSON.parse(event.data);
          const { event: evType, data } = payload;
          
          if (evType === 'handshake') {
            if (data.audioSettings) {
              audioSettings = data.audioSettings;
            }
          }
          else if (evType === 'settings_update') {
            if (data.audioSettings) {
              audioSettings = data.audioSettings;
            }
          }
          else if (evType === 'alert') {
            appendAlert(data);
            playAlertSound();
          }
        };

        ws.onclose = () => {
          statusDot.className = 'badge-indicator disconnected';
          statusText.innerText = 'Disconnected';
          setTimeout(connect, 3000);
        };

        ws.onerror = (err) => {
          console.error(err);
          ws.close();
        };
      } catch (err) {
        setTimeout(connect, 3000);
      }
    }

    function appendAlert(alert) {
      // Remove empty state if present
      if (emptyState) {
        emptyState.style.display = 'none';
      }

      // Check max limit
      while (container.children.length > maxAlerts) {
        container.removeChild(container.firstChild);
      }

      const card = document.createElement('div');
      card.id = alert.id;
      
      const timeStr = new Date(alert.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      
      const platform = alert.platform || 'youtube';
      const platformBadge = platform === 'kick' 
        ? `<span class="badge-icon" style="background-color: rgba(83, 252, 24, 0.15); color: #53fc18; border: 1px solid rgba(83, 252, 24, 0.3); margin-left: 6px; margin-right: 6px; vertical-align: middle;">KICK</span>`
        : `<span class="badge-icon" style="background-color: rgba(255, 0, 0, 0.15); color: #ff3e3e; border: 1px solid rgba(255, 0, 0, 0.3); margin-left: 6px; margin-right: 6px; vertical-align: middle;">YT</span>`;

      if (alert.type === 'superchat') {
        card.className = 'alert-card superchat';
        if (alert.color) {
          card.style.borderLeftColor = alert.color;
        }
        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-title">💬 ${alert.username} ${platformBadge} <span class="alert-badge">Super Chat</span></div>
            <div class="alert-amount">${alert.amount}</div>
          </div>
          <div class="alert-message">${alert.message}</div>
          <div class="alert-time">${timeStr}</div>
        `;
      } 
      else if (alert.type === 'sticker') {
        card.className = 'alert-card sticker';
        if (alert.color) {
          card.style.borderLeftColor = alert.color;
        }
        let stickerHtml = alert.stickerUrl ? `<img class="sticker-img" src="${alert.stickerUrl}">` : '';
        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-title">🎨 ${alert.username} ${platformBadge} <span class="alert-badge">Super Sticker</span></div>
            <div class="alert-amount">${alert.amount}</div>
          </div>
          ${stickerHtml}
          <div class="alert-time">${timeStr}</div>
        `;
      } 
      else if (alert.type === 'membership') {
        card.className = 'alert-card membership';
        const subtext = alert.details && alert.details.subtext ? alert.details.subtext : 'Welcome!';
        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-title">👑 ${alert.username} ${platformBadge} <span class="alert-badge">Membership</span></div>
            <div class="alert-amount">JOIN</div>
          </div>
          <div class="alert-message"><strong>${alert.message}</strong></div>
          <div class="alert-time">${timeStr}</div>
        `;
      } 
      else if (alert.type === 'membership_gift') {
        card.className = 'alert-card gift';
        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-title">🎁 ${alert.username} ${platformBadge} <span class="alert-badge">Gift Purchase</span></div>
            <div class="alert-amount">GIFT</div>
          </div>
          <div class="alert-message">${alert.message}</div>
          <div class="alert-time">${timeStr}</div>
        `;
      } 
      else if (alert.type === 'membership_redeemed') {
        card.className = 'alert-card gift';
        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-title">🎉 ${alert.username} ${platformBadge} <span class="alert-badge">Gift Claim</span></div>
            <div class="alert-amount">CLAIM</div>
          </div>
          <div class="alert-message">${alert.message}</div>
          <div class="alert-time">${timeStr}</div>
        `;
      }
      else if (alert.type === 'subscription') {
        card.className = 'alert-card subscription';
        card.innerHTML = `
          <div class="alert-header">
            <div class="alert-title">⭐ ${alert.username} ${platformBadge} <span class="alert-badge">New Subscriber</span></div>
            <div class="alert-amount">SUB</div>
          </div>
          <div class="alert-message">${alert.message}</div>
          <div class="alert-time">${timeStr}</div>
        `;
      }

      // Add as first child to show newest at the top (extremely easy to read newest alerts)
      container.insertBefore(card, container.firstChild);
    }

    // Init
    connect();
  </script>
</body>
</html>
